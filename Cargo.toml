[package]
name = "finakids"
version = "0.1.0"
edition = "2021"
description = "Finakids: simulación de vida y educación financiera en 3D"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "finakids"
path = "src/main.rs"

[dependencies]
wgpu = "30.0.1"
winit = { version = "0.30.13", features = ["android-native-activity"] }
glam = { version = "0.33", features = ["bytemuck"] }
bytemuck = { version = "1.25", features = ["derive"] }
fontdue = "0.9.4"
log = "0.4"
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0"
png = "0.18"
cpal = "0.18"

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", features = ["webgl"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "CssStyleDeclaration",
    "Storage",
    "Location",
    "Navigator",
    "Performance",
    "EventTarget",
    "Event",
    "AudioContext",
    "BaseAudioContext",
    "AudioContextState",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioScheduledSourceNode",
    "AudioNode",
    "AudioDestinationNode",
    "AudioParam",
    "GainNode",
    "StereoPannerNode",
] }
console_error_panic_hook = "0.1"
console_log = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[package.metadata.android]
package = "com.finakids.game"
apk_name = "finakids"
build_targets = ["aarch64-linux-android"]
resources = "android/res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Finakids"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
orientation = "sensorLandscape"
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|uiMode"
