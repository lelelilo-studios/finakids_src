<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0c10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Finakids: simulación de vida en 3D para aprender a manejar el dinero tomando decisiones.">
<title>Finakids</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0c10; overflow: hidden; overscroll-behavior: none; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #f4f1ec; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas#finakids-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; outline: none; touch-action: none; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: radial-gradient(1200px 700px at 30% 30%, #2a2340 0%, #0b0c10 60%); transition: opacity .8s ease; z-index: 10; }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .logo { font-size: clamp(42px, 9vw, 88px); font-weight: 800; letter-spacing: .02em; }
  .bar { width: 64px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, #ffb35c, transparent); }
  .tag { font-size: clamp(14px, 2.4vw, 20px); color: #c9c4bd; }
  .dots { display: flex; gap: 10px; margin-top: 8px; }
  .dots span { width: 9px; height: 9px; border-radius: 50%; background: #ffb35c; animation: b 1.2s infinite ease-in-out; }
  .dots span:nth-child(2) { animation-delay: .15s } .dots span:nth-child(3) { animation-delay: .3s }
  @keyframes b { 0%,80%,100% { transform: scale(.5); opacity: .4 } 40% { transform: scale(1); opacity: 1 } }
  .note { font-size: 13px; color: #9a958f; max-width: 520px; text-align: center; padding: 0 20px; line-height: 1.5; }
  #error { display: none; color: #ff8a8a; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 20; background: #0b0c10ee; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 18px; }
  @media (orientation: portrait) and (max-width: 700px) { #rotate.show { display: flex; } }
</style>
</head>
<body>
<canvas id="finakids-canvas" tabindex="0"></canvas>
<div id="loading">
  <div class="logo">FINAKIDS</div>
  <div class="bar"></div>
  <div class="tag">Tu vida. Tu dinero. Tus decisiones.</div>
  <div class="dots"><span></span><span></span><span></span></div>
  <div class="note" id="status">Cargando el mundo 3D… (la primera vez puede tardar unos segundos)</div>
  <div class="note" id="error"></div>
</div>
<div id="rotate" class="show"><div>📱↻<br><br>Gira tu teléfono para jugar en horizontal.</div></div>
<script type="module">
  const status = document.getElementById('status');
  const err = document.getElementById('error');
  function fail(msg) {
    status.style.display = 'none';
    err.style.display = 'block';
    err.textContent = msg;
  }
  window.addEventListener('error', (e) => { if (String(e.message || '').includes('unreachable')) fail('Ocurrió un error inesperado. Intenta recargar la página.'); });
  const canvas = document.getElementById('finakids-canvas');
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  // ---- character builders: Web Workers running the same wasm module
  let wasmModule = null;
  const pool = { workers: [], queue: [], results: [], timer: 0, broken: false };
  function killWorker(w, reason) {
    if (w.busy) pool.results.push({ id: w.busy.id, error: reason });
    w.busy = null;
    pool.workers = pool.workers.filter((x) => x !== w);
    try { w.terminate(); } catch (e) {}
    if (!pool.workers.length) {
      // no builders left: hand the queued jobs back to the main thread
      pool.broken = true;
      for (const j of pool.queue) pool.results.push({ id: j.id, error: reason });
      pool.queue = [];
    }
    pump();
  }
  function makeWorker() {
    const w = new Worker(new URL('./worker.js', import.meta.url), { type: 'module' });
    w.busy = null;
    w.ready = false;
    w.onmessage = (e) => {
      const d = e.data;
      if (d.ready) { w.ready = true; pump(); return; }
      if (d.fatal) { console.warn('worker init failed', d.fatal); killWorker(w, d.fatal); return; }
      pool.results.push(d);
      w.busy = null;
      pump();
    };
    w.onerror = (e) => { e.preventDefault(); console.warn('worker error', e.message); killWorker(w, String(e.message)); };
    w.postMessage({ init: wasmModule });
    return w;
  }
  function pump() {
    clearTimeout(pool.timer);
    for (const w of pool.workers) {
      if (!w.busy && w.ready && pool.queue.length) { w.busy = pool.queue.shift(); w.postMessage(w.busy); }
    }
    // free the workers' memory once everything is built (important on phones)
    if (!pool.queue.length && pool.workers.every((w) => !w.busy)) {
      pool.timer = setTimeout(() => { for (const w of pool.workers) w.terminate(); pool.workers = []; }, 4000);
    }
  }
  globalThis.__fkBuild = (id, key) => {
    if (pool.broken || typeof Worker === 'undefined') return false;
    try {
      const n = Math.max(1, Math.min(3, (navigator.hardwareConcurrency || 2) - 1));
      while (pool.workers.length < n) pool.workers.push(makeWorker());
    } catch (e) {
      console.warn('workers unavailable', e);
      pool.broken = true;
      return false;
    }
    pool.queue.push({ id, key });
    pump();
    return true;
  };
  globalThis.__fkPoll = () => (pool.results.length ? pool.results.shift() : null);

  // ---- phones: fullscreen + landscape on the first touch (Android)
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
  if (isMobile && document.documentElement.requestFullscreen) {
    const goFull = () => {
      if (document.fullscreenElement) return;
      document.documentElement.requestFullscreen({ navigationUI: 'hide' })
        .then(() => screen.orientation && screen.orientation.lock ? screen.orientation.lock('landscape') : null)
        .catch(() => {});
    };
    window.addEventListener('touchend', goFull, { once: true, capture: true });
  }

  const hasWebGPU = !!navigator.gpu;
  const hasWebGL2 = !!document.createElement('canvas').getContext('webgl2');
  if (!hasWebGPU && !hasWebGL2) {
    fail('Tu navegador no soporta WebGPU ni WebGL2. Prueba con Chrome, Edge, Firefox o Safari actualizados.');
  } else {
    status.textContent = 'Cargando el juego…';
    try {
      const mod = await import('./pkg/finakids.js');
      const wasmUrl = new URL('./pkg/finakids_bg.wasm', import.meta.url);
      try {
        wasmModule = await WebAssembly.compileStreaming(fetch(wasmUrl));
      } catch (e) {
        try { wasmModule = await WebAssembly.compile(await (await fetch(wasmUrl)).arrayBuffer()); } catch (e2) { wasmModule = null; }
      }
      await mod.default(wasmModule ? { module_or_path: wasmModule } : undefined);
      status.textContent = hasWebGPU ? 'Iniciando gráficos (WebGPU)…' : 'Iniciando gráficos (WebGL2)…';
      try {
        mod.start_game();
      } catch (e) {
        // winit leaves the start function with an exception on purpose
        if (!String(e).includes('Using exceptions for control flow')) throw e;
      }
    } catch (e) {
      if (!String(e).includes('Using exceptions for control flow')) {
        console.error(e);
        fail('No se pudo iniciar el juego: ' + e);
      }
    }
  }
  const rot = document.getElementById('rotate');
  function checkRot() { rot.classList.toggle('show', window.innerHeight > window.innerWidth && window.innerWidth < 700); }
  window.addEventListener('resize', checkRot); checkRot();
  canvas.focus();
</script>
</body>
</html>
