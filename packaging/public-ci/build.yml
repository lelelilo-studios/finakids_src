# Builds every platform from the private source repo (finakids_src) and publishes
# only the resulting builds to this repository (GitHub Pages).
name: Build & publish

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref of finakids_src to build'
        default: 'main'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SRC_REPO: lelelilo-studios/finakids_src

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: '${{ env.SRC_REPO }}', ref: '${{ inputs.ref }}', ssh-key: '${{ secrets.SRC_DEPLOY_KEY }}' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - id: wb
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep version | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with: { tool: 'wasm-bindgen@${{ steps.wb.outputs.version }}' }
      - run: |
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - run: ./scripts/build_web.sh dist/web
      - uses: actions/upload-artifact@v4
        with: { name: web, path: dist/web }

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { repository: '${{ env.SRC_REPO }}', ref: '${{ inputs.ref }}', ssh-key: '${{ secrets.SRC_DEPLOY_KEY }}' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo build --release --bin finakids
      - run: |
          mkdir -p pkg/Finakids && cp target/release/finakids pkg/Finakids/ && cp packaging/icons/icon_256.png pkg/Finakids/finakids.png
          tar -C pkg -czf Finakids-linux-x64.tar.gz Finakids
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: Finakids-linux-x64.tar.gz }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: '${{ env.SRC_REPO }}', ref: '${{ inputs.ref }}', ssh-key: '${{ secrets.SRC_DEPLOY_KEY }}' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin finakids
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg/Finakids | Out-Null
          Copy-Item target/release/finakids.exe pkg/Finakids/
          Compress-Archive -Path pkg/Finakids -DestinationPath Finakids-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: Finakids-windows-x64.zip }

  apple:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { repository: '${{ env.SRC_REPO }}', ref: '${{ inputs.ref }}', ssh-key: '${{ secrets.SRC_DEPLOY_KEY }}' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim' }
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/package_macos.sh dist/macos
      - run: ./scripts/package_ios.sh dist/ios
      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: |
            dist/macos/Finakids-macos-universal.zip
            dist/ios/Finakids-ios-unsigned.ipa
            dist/ios/Finakids-ios-simulator.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: '${{ env.SRC_REPO }}', ref: '${{ inputs.ref }}', ssh-key: '${{ secrets.SRC_DEPLOY_KEY }}' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-apk --locked
      - name: Build APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/release.p12"
            export CARGO_APK_RELEASE_KEYSTORE_PASSWORD="$KS_PASS"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 -storepass android -alias finakids -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Finakids"
            export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/release.p12"
            export CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android
          fi
          cargo apk build --release --lib
          cp "$(find target -name 'finakids.apk' | head -1)" Finakids-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: Finakids-android-arm64.apk }

  publish:
    needs: [web, linux, windows, apple, android]
    if: always() && needs.web.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: '${{ env.SRC_REPO }}', ref: '${{ inputs.ref }}', ssh-key: '${{ secrets.SRC_DEPLOY_KEY }}', path: src }
      - uses: actions/checkout@v4
        with: { path: site-current }
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Assemble site
        run: |
          mkdir -p downloads
          cp site-current/downloads/* downloads/ 2>/dev/null || true
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' -o -name '*.ipa' \) -exec cp {} downloads/ \;
          ls -la downloads
          ./src/scripts/assemble_site.sh artifacts/web downloads site
      - name: Commit builds
        run: |
          cd site
          git init -q -b main
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Builds $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main
